services:
  - type: web
    name: lunarcord-server
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lunarcord-db
          property: connectionString
      - key: LUNARCORD_JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
databases:
  - name: lunarcord-db
    plan: free
